services:
  - type: web
    name: quqi-qa
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL        # cadena de conexión de Neon (la pegas tú en Render)
        sync: false
      - key: ADMIN_USER          # usuario del primer administrador
        value: ana
      - key: ADMIN_NAME
        value: Ana Cortés
      - key: ADMIN_PASSWORD      # clave inicial del administrador (solo se usa si la base no tiene usuarios)
        sync: false
      - key: GEMINI_API_KEY      # llave de Google AI Studio (opcional: sin ella la IA queda apagada)
        sync: false
      - key: GEMINI_MODEL        # admite varios separados por coma (principal,respaldo)
        value: gemini-3.8-flash
      - key: AZURE_DEVOPS_ORG    # nombre de tu organización en Azure DevOps (dev.azure.com/<ORG>). Opcional
        sync: false
      - key: AZURE_DEVOPS_PAT    # llave personal de SOLO LECTURA (Work Items: Read). Opcional
        sync: false
      - key: AZURE_DEVOPS_PROJECT  # proyecto de Azure por defecto (cada proyecto de QUQI_QA puede indicar otro)
        sync: false
      - key: AZURE_TEST_PROJECT  # opcional: proyecto de Azure donde están los planes de pruebas (Test Plans); si no, se usa AZURE_DEVOPS_PROJECT
        sync: false
      - key: AZURE_SYNC_MINUTES  # cada cuántos minutos se actualizan los bugs solos (mínimo 5)
        value: "30"
      - key: AZURE_DEVOPS_PAT_WRITE  # Ambientes: llave con Work Items → Read & Write para crear y cerrar los Issues (si falta, se usa AZURE_DEVOPS_PAT)
        sync: false
      - key: AMB_MAIL_URL        # Ambientes: URL /exec del Apps Script (modo directo). DÉJALA VACÍA para el modo cola (ver apps_script_correo_cola.gs)
        sync: false
      - key: AMB_MAIL_SECRET     # Ambientes: la misma clave que pusiste en las propiedades del Apps Script
        sync: false
      - key: CARGUE_AZURE_PROJECT   # Cargue de proyectos en QA: proyecto de Azure donde se crean Feature/US/Test Plan (por defecto «Gestion Proyectos»; distinto de AZURE_DEVOPS_PROJECT)
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID  # Cargue de proyectos en QA: Drive (generados una vez con setup_google_auth.py del Agente QA)
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: DRIVE_ROOT_FOLDER_ID    # carpeta raíz «Unidad QA/Requerimientos/2026/QA» (ID de la URL de Drive)
        sync: false
      - key: AMB_REMINDER_MINUTES  # cada cuántos minutos se revisan los recordatorios automáticos
        value: "10"
